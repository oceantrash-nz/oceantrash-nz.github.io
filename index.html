<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Conservation Survey</title>
    <style>
        /* Deep Navy Ocean Theme */
        :root {
            --navy-bg: #0a1128;
            --navy-panel: #1c2541;
            --ocean-blue: #3a506b;
            --text-color: #ffffff;
            --accent: #5bc0be;
        }

        body {
            background-color: var(--navy-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Typography */
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 40px;
            text-align: center;
            color: var(--accent);
        }

        /* Containers */
        .container {
            background-color: var(--navy-panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        /* Settings Panel */
        .settings-panel {
            background-color: var(--ocean-blue);
            border: 1px dashed var(--accent);
        }

        .settings-panel h3 {
            margin-top: 0;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .radio-group label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            margin-right: 8px;
            accent-color: var(--accent);
        }

        input[type="text"], input[type="url"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--navy-bg);
            border: 1px solid var(--ocean-blue);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        input[type="text"]:focus, input[type="url"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Button */
        button {
            background-color: var(--accent);
            color: var(--navy-bg);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #4eb0ae;
        }
    </style>
</head>
<body>

    <h1>Ocean Conservation</h1>
    <h2>Help us understand environmental habits</h2>

    <!-- Configurable Settings -->
    <div class="container settings-panel">
        <h3>Admin Settings</h3>
        <p style="font-size: 0.9rem; margin-bottom: 15px;">Configure where the anonymous survey data is sent.</p>
        <div class="form-group">
            <label for="webhook-url">Discord Webhook URL:</label>
            <input type="url" id="webhook-url" placeholder="https://discord.com/api/webhooks/..." required>
        </div>
    </div>

    <!-- Survey Form -->
    <div class="container">
        <form id="survey-form">
            <!-- Question 1 -->
            <div class="form-group">
                <label>Do you litter?</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="litter" value="yes" id="litter-yes" required> Yes
                    </label>
                    <label>
                        <input type="radio" name="litter" value="no" id="litter-no"> No
                    </label>
                </div>
            </div>

            <!-- Question 2 (Dynamic) -->
            <div class="form-group" id="q2-container" style="display: none;">
                <label id="q2-label">Why do you do it?</label>
                <textarea id="reason" placeholder="Enter your response here..." required></textarea>
            </div>

            <!-- Question 3 -->
            <div class="form-group">
                <label>How could we prevent it from happening?</label>
                <textarea id="prevention" placeholder="Enter your response here..." required></textarea>
            </div>

            <button type="submit">Submit Anonymously</button>
        </form>
    </div>

    <script>
        // DOM Elements
        const litterYes = document.getElementById('litter-yes');
        const litterNo = document.getElementById('litter-no');
        const q2Container = document.getElementById('q2-container');
        const q2Label = document.getElementById('q2-label');
        const surveyForm = document.getElementById('survey-form');

        // Dynamic Question Logic
        function updateQuestionTwo() {
            q2Container.style.display = 'block'; // Show the question once an option is picked
            if (litterYes.checked) {
                q2Label.textContent = "Why do you do it?";
            } else if (litterNo.checked) {
                q2Label.textContent = "Why do you think people do it?";
            }
        }

        litterYes.addEventListener('change', updateQuestionTwo);
        litterNo.addEventListener('change', updateQuestionTwo);

        // Form Submission Logic
        surveyForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent standard page reload

            const webhookUrl = document.getElementById('webhook-url').value;
            
            if (!webhookUrl) {
                alert("Error: Please configure the Discord Webhook URL in the Admin Settings first.");
                return;
            }

            // Gather Data
            const isLittering = litterYes.checked ? "Yes" : "No";
            const q2Question = q2Label.textContent;
            const reasonResponse = document.getElementById('reason').value;
            const preventionResponse = document.getElementById('prevention').value;

            // Construct Discord Embedded Message Payload
            const payload = {
                username: "Anonymous Survey Bot",
                embeds: [{
                    title: "📝 New Survey Submission",
                    color: 2386347, // Matches the theme accent color
                    fields: [
                        {
                            name: "Do you litter?",
                            value: isLittering,
                            inline: false
                        },
                        {
                            name: q2Question,
                            value: reasonResponse,
                            inline: false
                        },
                        {
                            name: "How could we prevent it from happening?",
                            value: preventionResponse,
                            inline: false
                        }
                    ],
                    footer: {
                        text: "Sent anonymously via Ocean Conservation Survey"
                    }
                }]
            };

            // Send to Discord
            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("Thank you! Your survey has been submitted anonymously.");
                    surveyForm.reset();
                    q2Container.style.display = 'none'; // Hide dynamic question again
                } else {
                    alert("Submission failed. Make sure your Discord Webhook URL is correct.");
                }
            } catch (error) {
                alert("An error occurred while sending the data: " + error.message);
            }
        });
    </script>
</body>
</html>
